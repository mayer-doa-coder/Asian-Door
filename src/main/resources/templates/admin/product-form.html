<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{header :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/figma-shared.css}"/>
    <link rel="stylesheet" th:href="@{/css/admin-figma.css}"/>
    <title th:text="${editMode} ? 'Edit Product - Admin | Asian Door' : 'Add Product - Admin | Asian Door'">
        Product Form - Admin | Asian Door
    </title>
</head>
<body class="admin-figma">
<th:block th:replace="~{fragments/figma-shell :: topNav('shop', '#')}"></th:block>
<main th:replace="~{fragments/admin-shell :: adminPage('products', 'Dashboard', ~{::formContent})}">
    <th:block th:fragment="formContent">
        <div class="content-grid">
            <section class="product-form-card">
                <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
                    <h2 class="mb-0" th:text="${editMode} ? 'Edit Product' : 'Create New Product'">Product Form</h2>
                    <span class="badge-soft" th:text="${editMode} ? 'Update Mode' : 'Create Mode'">Mode</span>
                </div>

                <form th:action="${editMode} ? @{/admin/products/{id}(id=${productDTO.id})} : @{/admin/products}"
                      th:object="${productDTO}"
                      method="post"
                      enctype="multipart/form-data"
                      novalidate>

                    <input type="hidden" th:field="*{imageUrl}" />

                    <div class="mb-3">
                        <label for="name" class="form-label">Product Name</label>
                        <input type="text" id="name" th:field="*{name}" class="form-control"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                               placeholder="e.g. Pine Wood Entry Door" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="category" class="form-label">Category</label>
                            <select id="category" th:field="*{category}" class="form-select"
                                    th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'">
                                <option value="">— Select category —</option>
                                <option value="wooden">Wooden Door</option>
                                <option value="steel">Steel Door</option>
                                <option value="glass">Glass Door</option>
                                <option value="security">Security Door</option>
                                <option value="interior">Interior Door</option>
                                <option value="exterior">Exterior Door</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="material" class="form-label">Material</label>
                            <input type="text" id="material" th:field="*{material}" class="form-control"
                                   th:classappend="${#fields.hasErrors('material')} ? 'is-invalid'"
                                   placeholder="e.g. Mahogany Wood" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('material')}" th:errors="*{material}"></div>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="price" class="form-label">Price (Tk)</label>
                            <input type="number" id="price" th:field="*{price}" class="form-control"
                                   th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"
                                   step="0.01" min="0.01" placeholder="0.00" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="stock" class="form-label">Stock</label>
                            <input type="number" id="stock" th:field="*{stock}" class="form-control"
                                   th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'"
                                   min="0" placeholder="0" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="dimensions" class="form-label">Dimensions</label>
                        <input type="text" id="dimensions" th:field="*{dimensions}" class="form-control"
                               placeholder="e.g. 210 × 90 cm" />
                    </div>

                    <div class="mb-3">
                        <label for="lockSystem" class="form-label">Lock System</label>
                        <input type="text" id="lockSystem" th:field="*{lockSystem}" class="form-control"
                               placeholder="e.g. Multi-point lock" />
                    </div>

                    <div class="mb-3">
                        <label for="imageFile" class="form-label">Product Photo</label>
                        <input type="file" id="imageFile" name="imageFile" class="form-control" accept="image/*" />
                        <div class="text-danger small mt-1" th:if="${uploadError}" th:text="${uploadError}"></div>
                    </div>

                    <div class="mb-3" th:if="${productDTO.imageUrl != null and !#strings.isEmpty(productDTO.imageUrl)}">
                        <label class="form-label">Current Photo</label>
                        <div>
                            <img th:src="${productDTO.imageUrl}" alt="Current product image"
                                 class="img-thumbnail" style="max-width:220px;" />
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label">Description</label>
                        <textarea id="description" th:field="*{description}" class="form-control" rows="4"
                                  placeholder="Describe the product's features and use cases"></textarea>
                    </div>

                    <div class="d-flex gap-2 justify-content-end flex-wrap">
                        <a th:href="@{/admin/products}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-dark">
                            <span th:text="${editMode} ? 'Save Changes' : 'Create Product'">Submit</span>
                        </button>
                    </div>
                </form>
            </section>

            <aside class="panel-card">
                <h2 class="mb-2">Form Notes</h2>
                <p class="text-muted small mb-3">Keep product data consistent so catalog search and checkout remain correct.</p>

                <ul class="list-group list-group-flush small">
                    <li class="list-group-item px-0 d-flex justify-content-between">
                        <span>Route (Create)</span>
                        <strong>POST /admin/products</strong>
                    </li>
                    <li class="list-group-item px-0 d-flex justify-content-between">
                        <span>Route (Edit)</span>
                        <strong>POST /admin/products/{id}</strong>
                    </li>
                    <li class="list-group-item px-0 d-flex justify-content-between">
                        <span>Image Upload</span>
                        <strong>imageFile</strong>
                    </li>
                    <li class="list-group-item px-0 d-flex justify-content-between">
                        <span>Validation</span>
                        <strong>Bean Validation</strong>
                    </li>
                </ul>
            </aside>
        </div>
    </th:block>
</main>

<th:block th:replace="~{footer :: scripts}"></th:block>
</body>
</html>
