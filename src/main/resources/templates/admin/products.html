<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{header :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/figma-shared.css}"/>
    <link rel="stylesheet" th:href="@{/css/admin-figma.css}"/>
    <title>Manage Products - Admin | Asian Wooden Decor</title>
</head>
<body class="admin-figma">
<th:block th:replace="~{fragments/figma-shell :: topNav('shop', '#')}"></th:block>
<main th:replace="~{fragments/admin-shell :: adminPage('products', 'Dashboard', ~{::productsContent})}">
    <th:block th:fragment="productsContent">
        <section class="panel-card">
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-2">
                <h2 class="mb-0">Products</h2>
                <a th:href="@{/admin/products/new}" class="create-btn"><i class="bi bi-plus-lg me-1"></i>Create Product</a>
            </div>

            <div class="d-flex flex-wrap gap-2 mb-3">
                <span class="badge-soft">Total: <strong th:text="${totalProducts}">0</strong></span>
                <span class="badge-soft">Low Stock: <strong th:text="${lowStockCount}">0</strong></span>
                <span class="badge-soft">Out of Stock: <strong th:text="${outOfStockCount}">0</strong></span>
            </div>

            <div th:if="${successMessage}" class="alert alert-success py-2 mt-2 mb-2" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${successMessage}"></span>
            </div>

            <div class="table-responsive admin-table">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th class="ps-3" style="width:64px;">ID</th>
                        <th>Product</th>
                        <th>Category</th>
                        <th class="text-end">Price (Tk)</th>
                        <th class="text-center">Stock</th>
                        <th class="text-center" style="width:128px;">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="product : ${products}">
                        <td class="ps-3 text-muted small" th:text="${product.id}">1</td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <img th:src="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl)} ? ${product.imageUrl} : @{/images/country-house-door-pine-wood.jpg}"
                                     alt="Product image"
                                     style="width:42px;height:32px;object-fit:cover;border-radius:.25rem;"/>
                                <div>
                                    <a th:href="@{/products/{id}(id=${product.id})}" target="_blank"
                                       class="fw-semibold text-dark text-decoration-none"
                                       th:text="${product.name}">Product Name</a>
                                    <p class="mb-0 text-muted small" th:text="${product.material != null ? product.material : '—'}">Material</p>
                                </div>
                            </div>
                        </td>
                        <td><span class="category-pill" th:text="${product.category != null ? #strings.capitalize(product.category) : '—'}">Category</span></td>
                        <td class="text-end fw-semibold"
                            th:text="${product.price != null}
                                ? ${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}
                                : '0.00'">0.00</td>
                        <td class="text-center">
                            <span th:text="${product.stock}"
                                  th:classappend="${product.stock == 0} ? 'stock-out' : (${product.stock <= 5} ? 'stock-low' : 'stock-ok')">0</span>
                        </td>
                        <td class="text-center">
                            <div class="d-inline-flex gap-1">
                                <a th:href="@{/admin/products/{id}/edit(id=${product.id})}" class="btn btn-outline-secondary action-btn" title="Edit">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post"
                                      onsubmit="return confirm('Delete ' + this.dataset.name + '?');"
                                      th:data-name="${product.name}">
                                    <button type="submit" class="btn btn-outline-danger action-btn" title="Delete">
                                        <i class="bi bi-trash3"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${products == null or #lists.isEmpty(products)}">
                        <td colspan="6" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox display-6 d-block mb-2"></i>
                            <p class="mb-2 fw-semibold">No products available</p>
                            <a th:href="@{/admin/products/new}" class="btn btn-primary btn-sm">Create first product</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </th:block>
</main>

<th:block th:replace="~{footer :: scripts}"></th:block>
</body>
</html>
