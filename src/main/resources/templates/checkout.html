<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{header :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/figma-shared.css}"/>
    <title>Asian Wooden Decor | Checkout</title>

    <style>
        .figma-flow {
            background: #f6f6f6;
            color: #2f2f2f;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .figma-flow a { text-decoration: none; }

        .figma-flow .section-title { font-size: 2rem; font-weight: 700; color: #2b2b2b; margin-bottom: .4rem; }
        .figma-flow .section-sub { color: #8d8d8d; margin-bottom: 1.6rem; }

        .figma-flow .checkout-shell { padding-bottom: 2.6rem; }

        .figma-flow .item-list {
            border: 1px solid #e8e8e8;
            background: #fff;
        }

        .figma-flow .item-list .list-group-item {
            border-left: 0;
            border-right: 0;
            border-color: #efefef;
            padding-top: .95rem;
            padding-bottom: .95rem;
        }

        .figma-flow .checkout-item-title { font-weight: 700; color: #2b2b2b; }
        .figma-flow .checkout-item-meta { color: #7f7f7f; font-size: .84rem; }

        .figma-flow .summary {
            border: 1px solid #e8e8e8;
            background: #fff;
            padding: 1.35rem;
        }

        .figma-flow .summary .label {
            font-size: .78rem;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: #7e7e7e;
            font-weight: 700;
            margin-bottom: .45rem;
        }

        .figma-flow .checkout-total {
            font-size: 1.8rem;
            font-weight: 800;
            color: #2b2b2b;
            margin: 0;
        }

        .figma-flow .confirm-btn {
            border: 0;
            border-radius: 0;
            background: #393939;
            color: #f4f4f4;
            font-weight: 700;
            width: 100%;
            min-height: 46px;
            margin-top: .85rem;
        }

        .figma-flow .confirm-btn:disabled { opacity: .55; cursor: not-allowed; }

        .figma-flow .checkout-empty {
            border: 1px dashed #cfd4d9;
            background: #fff;
            text-align: center;
            padding: 1.6rem;
        }

    </style>
</head>
<body>
<main class="figma-flow" data-checkout-page="true">
    <th:block th:replace="~{fragments/figma-shell :: topNav('shop', '#checkout-footer')}"></th:block>

    <section class="container checkout-shell">
        <h1 class="section-title">Checkout</h1>
        <p class="section-sub">Review your order summary and place your order in one step.</p>

        <div id="checkoutAlertHost" class="mb-3"></div>

        <div class="row g-4 align-items-start">
            <section class="col-lg-8">
                <div class="item-list">
                    <div class="list-group list-group-flush" id="checkoutItemsList">
                        <div class="list-group-item text-muted text-center py-4">Loading order summary...</div>
                    </div>
                </div>

                <div id="checkoutEmptyState" class="checkout-empty mt-3 d-none">
                    <i class="bi bi-cart-x fs-2 text-muted"></i>
                    <h5 class="mt-2 mb-1">No items available for checkout</h5>
                    <p class="text-muted mb-3">Add products to cart first.</p>
                    <a th:href="@{/cart/view}" class="btn btn-dark btn-sm">
                        <i class="bi bi-cart3 me-1"></i>Back to Cart
                    </a>
                </div>
            </section>

            <aside class="col-lg-4">
                <div class="summary sticky-top" style="top:88px;">
                    <p class="label">Total Price</p>
                    <p class="checkout-total" id="checkoutTotalPrice">PHP 0.00</p>
                    <p class="small text-muted mb-2">Items: <span id="checkoutItemCount">0</span></p>

                    <button id="confirmOrderBtn" class="confirm-btn" disabled>
                        <i class="bi bi-check2-circle me-1"></i>Confirm Order
                    </button>

                    <a th:href="@{/cart/view}" class="btn btn-outline-dark w-100 mt-2 rounded-0">
                        <i class="bi bi-arrow-left me-1"></i>Return to Cart
                    </a>
                </div>
            </aside>
        </div>
    </section>

    <footer th:replace="~{fragments/figma-shell :: darkFooter('checkout-footer')}"></footer>
</main>

<th:block th:replace="~{footer :: scripts}"></th:block>
</body>
</html>
