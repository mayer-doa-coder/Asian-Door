<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Register</title>
</head>
<body>
<div layout:fragment="content">

    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-8 col-lg-6 col-xl-5">

            <div class="card border-0 shadow-sm mt-3">
                <div class="card-body p-4">

                    <div class="text-center mb-4">
                        <i class="bi bi-person-plus-fill display-5 text-danger"></i>
                        <h4 class="fw-bold mt-2">Create an Account</h4>
                        <p class="text-muted small">Join Asian Door and start shopping today</p>
                    </div>

                    <!-- Server-side validation errors -->
                    <div th:if="${errorMessage}" class="alert alert-danger py-2 small">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i>
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="@{/register}" method="post"
                          th:object="${registerRequest}" novalidate>

                        <!-- Full Name -->
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold small">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" id="fullName" class="form-control"
                                       th:field="*{fullName}"
                                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                                       placeholder="Juan dela Cruz"
                                       autocomplete="name" required />
                                <div class="invalid-feedback" th:errors="*{fullName}"></div>
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold small">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="email" class="form-control"
                                       th:field="*{email}"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                       placeholder="you@example.com"
                                       autocomplete="email" required />
                                <div class="invalid-feedback" th:errors="*{email}"></div>
                            </div>
                        </div>

                        <!-- Phone (optional) -->
                        <div class="mb-3">
                            <label for="phone" class="form-label fw-semibold small">
                                Phone Number <span class="text-muted fw-normal">(optional)</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                <input type="tel" id="phone" class="form-control"
                                       th:field="*{phone}"
                                       placeholder="+63 9XX XXX XXXX"
                                       autocomplete="tel" />
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold small">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" id="password" class="form-control"
                                       th:field="*{password}"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                       placeholder="Min. 8 characters"
                                       autocomplete="new-password" required />
                                <button class="btn btn-outline-secondary" type="button"
                                        onclick="togglePwd('password', this)">
                                    <i class="bi bi-eye"></i>
                                </button>
                                <div class="invalid-feedback" th:errors="*{password}"></div>
                            </div>
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label fw-semibold small">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" id="confirmPassword" class="form-control"
                                       th:field="*{confirmPassword}"
                                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                                       placeholder="Repeat your password"
                                       autocomplete="new-password" required />
                                <button class="btn btn-outline-secondary" type="button"
                                        onclick="togglePwd('confirmPassword', this)">
                                    <i class="bi bi-eye"></i>
                                </button>
                                <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-person-check me-1"></i> Create Account
                            </button>
                        </div>
                    </form>

                    <hr />
                    <p class="text-center small mb-0">
                        Already have an account?
                        <a th:href="@{/login}" class="text-danger fw-semibold text-decoration-none">Sign in</a>
                    </p>

                </div>
            </div>

        </div>
    </div>

</div>

<th:block layout:fragment="scripts">
    <script>
        function togglePwd(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon  = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }
    </script>
</th:block>
</body>
</html>
