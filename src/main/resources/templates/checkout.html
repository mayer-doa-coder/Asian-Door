<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{header :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/figma-shared.css}"/>
    <title>Asian Door | Checkout</title>

    <style>
        .figma-flow {
            background: #f6f6f6;
            color: #2f2f2f;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .figma-flow .checkout-wrap {
            padding-top: 2rem;
            padding-bottom: 2.5rem;
        }

        .figma-flow .checkout-title {
            font-size: 2rem;
            font-weight: 800;
            margin: 0 0 1rem;
        }

        .figma-flow .checkout-card,
        .figma-flow .summary-card {
            background: #fff;
            border: 1px solid #e9e9e9;
            border-radius: .8rem;
            padding: 1.2rem;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .03);
        }

        .figma-flow .checkout-card {
            margin-bottom: 1rem;
        }

        .figma-flow .card-heading {
            font-size: 1.12rem;
            font-weight: 700;
            margin: 0 0 .85rem;
            color: #252525;
        }

        .figma-flow .order-items .list-group-item {
            border-color: #efefef;
            padding-left: 0;
            padding-right: 0;
            background: transparent;
        }

        .figma-flow .checkout-item-title {
            font-weight: 700;
            color: #2b2b2b;
            margin-bottom: .2rem;
        }

        .figma-flow .checkout-item-meta {
            color: #777;
            font-size: .84rem;
            margin: 0;
        }

        .figma-flow .checkout-form .form-label {
            font-size: .86rem;
            font-weight: 600;
            color: #484848;
            margin-bottom: .35rem;
        }

        .figma-flow .checkout-form .form-control,
        .figma-flow .checkout-form textarea {
            border: 1px solid #d8d8d8;
            border-radius: .42rem;
            padding: .54rem .68rem;
            font-size: .92rem;
            color: #2f2f2f;
            background: #fff;
        }

        .figma-flow .checkout-form .form-control:focus,
        .figma-flow .checkout-form textarea:focus {
            border-color: #8b8b8b;
            box-shadow: none;
        }

        .figma-flow .payment-option {
            border: 1px solid #dedede;
            background: #fafafa;
            border-radius: .45rem;
            padding: .45rem .6rem;
            margin-bottom: .5rem;
            display: flex;
            align-items: center;
            gap: .55rem;
            font-size: .92rem;
            color: #303030;
        }

        .figma-flow .summary-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #585858;
            font-weight: 600;
            margin-bottom: .5rem;
        }

        .figma-flow .summary-total {
            border-top: 1px solid #ececec;
            margin-top: .7rem;
            padding-top: .7rem;
            display: flex;
            justify-content: space-between;
            font-size: 1.15rem;
            font-weight: 800;
            color: #252525;
        }

        .figma-flow .confirm-btn {
            width: 100%;
            min-height: 45px;
            border: 0;
            border-radius: .2rem;
            background: #111;
            color: #fff;
            font-weight: 700;
            margin-top: .9rem;
        }

        .figma-flow .confirm-btn:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .figma-flow .checkout-empty {
            border: 1px dashed #cfcfcf;
            background: #fff;
            border-radius: .7rem;
            text-align: center;
            padding: 1.5rem;
            margin-top: .9rem;
        }

    </style>
</head>
<body>
<main class="figma-flow" data-checkout-page="true">
    <th:block th:replace="~{fragments/figma-shell :: topNav('shop', '#checkout-footer')}"></th:block>

    <section class="container checkout-wrap">
        <h1 class="checkout-title">Checkout</h1>

        <div id="checkoutAlertHost" class="mb-3"></div>

        <div class="row g-4 align-items-start">
            <section class="col-lg-8">
                <div class="checkout-card order-items">
                    <h2 class="card-heading">Order Items</h2>
                    <div class="list-group list-group-flush" id="checkoutItemsList">
                        <div class="list-group-item text-muted text-center py-4">Loading order summary...</div>
                    </div>
                </div>

                <div class="checkout-card checkout-form">
                    <h2 class="card-heading">Order Information</h2>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="checkoutName">Name</label>
                            <input id="checkoutName" type="text" class="form-control" autocomplete="name" required
                                   th:value="${user != null ? user.name : ''}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="checkoutEmail">Email</label>
                            <input id="checkoutEmail" type="email" class="form-control" autocomplete="email" required
                                   th:value="${user != null ? user.email : ''}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="checkoutPhone">Mobile Number</label>
                            <input id="checkoutPhone" type="text" class="form-control" placeholder="01XXXXXXXXX" autocomplete="tel" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="checkoutAddress">Address</label>
                            <input id="checkoutAddress" type="text" class="form-control" autocomplete="street-address" required>
                        </div>
                    </div>
                </div>

                <div id="checkoutEmptyState" class="checkout-empty mt-3 d-none">
                    <i class="bi bi-cart-x fs-2 text-muted"></i>
                    <h5 class="mt-2 mb-1">No items available for checkout</h5>
                    <p class="text-muted mb-3">Add products to cart first.</p>
                    <a th:href="@{/cart/view}" class="btn btn-dark btn-sm">
                        <i class="bi bi-cart3 me-1"></i>Back to Cart
                    </a>
                </div>
            </section>

            <aside class="col-lg-4">
                <div class="summary-card sticky-top" style="top:88px;">
                    <h2 class="card-heading">Summary</h2>

                    <div class="summary-row">
                        <span>Items</span>
                        <span id="checkoutItemCount">0</span>
                    </div>
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span id="checkoutSubtotal">Tk 0.00</span>
                    </div>

                    <div class="mt-3 mb-2 fw-semibold text-muted" style="font-size: .85rem;">Payment Method</div>
                    <label class="payment-option">
                        <input type="radio" name="checkoutPaymentMethod" value="BKASH">
                        <span>Bkash</span>
                    </label>
                    <label class="payment-option mb-0">
                        <input type="radio" name="checkoutPaymentMethod" value="CASH_ON_DELIVERY" checked>
                        <span>Cash on Delivery</span>
                    </label>

                    <div class="summary-total">
                        <span>Total</span>
                        <span id="checkoutTotalPrice">Tk 0.00</span>
                    </div>

                    <button id="confirmOrderBtn" class="confirm-btn" disabled>
                        Confirm Order
                    </button>

                    <a th:href="@{/cart/view}" class="btn btn-outline-dark w-100 mt-2 rounded-0">
                        <i class="bi bi-arrow-left me-1"></i>Return to Cart
                    </a>
                </div>
            </aside>
        </div>
    </section>

    <footer th:replace="~{fragments/figma-shell :: darkFooter('checkout-footer')}"></footer>
</main>

<th:block th:replace="~{footer :: scripts}"></th:block>
</body>
</html>
