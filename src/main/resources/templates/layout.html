<!DOCTYPE html>
<!--
  layout.html - Base page skeleton for Asian Wooden Decor.

  Usage in any page template (native Thymeleaf, no external dialect needed):

    <html th:replace="~{layout :: layout(~{::title}, ~{::style}, ~{::main})}">
    <head>
        <title>Page Title - Asian Wooden Decor</title>
        <style> page-specific CSS (optional) </style>
    </head>
    <body>
        <main> page content </main>
    </body>
    </html>

  Parameters:
    pageTitle  - title element from the calling page  (required)
    pageStyles - style element from the calling page  (pass ~{} when none)
    content    - main  element from the calling page  (required)
-->
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(pageTitle, pageStyles, content)">
<head>
    <th:block th:replace="~{header :: head}"></th:block>
    <title th:replace="${pageTitle}">Asian Wooden Decor</title>
    <th:block th:replace="${pageStyles}"></th:block>
</head>
<body>

    <!-- Site navigation (replaced from header.html :: header) -->
    <nav th:replace="~{header :: header}"></nav>

    <!-- Page content injected here -->
    <th:block th:replace="${content}"></th:block>

    <!-- Site footer (replaced from footer.html :: footer) -->
    <footer th:replace="~{footer :: footer}"></footer>

    <!-- Bootstrap JS + site JS -->
    <th:block th:replace="~{footer :: scripts}"></th:block>

</body>
</html>
