<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{header :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/figma-shared.css}"/>
    <title>Asian Door | Verify Reset Code</title>

    <style>
        .figma-auth {
            background: #f6f6f6;
            color: #2f2f2f;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .figma-auth a { text-decoration: none; }

        .figma-auth .auth-wrap {
            padding: 1.2rem 0 3rem;
        }

        .figma-auth .auth-box {
            background: #fff;
            border: 1px solid #ececec;
            box-shadow: 0 16px 40px rgba(0, 0, 0, .06);
        }

        .figma-auth .auth-visual {
            background: linear-gradient(rgba(0,0,0,.28), rgba(0,0,0,.28)),
                        url([[@{/images/products/door8.png}]]) center/cover no-repeat;
            min-height: 520px;
            display: flex;
            align-items: end;
            color: #fff;
            padding: 2rem;
        }

        .figma-auth .auth-visual h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: .55rem;
        }

        .figma-auth .auth-visual p {
            margin: 0;
            color: rgba(255,255,255,.85);
            line-height: 1.45;
        }

        .figma-auth .auth-form {
            padding: 2rem;
        }

        .figma-auth .auth-title {
            font-size: 1.9rem;
            font-weight: 700;
            color: #2b2b2b;
            margin-bottom: .3rem;
        }

        .figma-auth .auth-subtitle {
            color: #8d8d8d;
            margin-bottom: 1.1rem;
            font-size: .94rem;
        }

        .figma-auth .form-label {
            font-size: .8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: #666;
        }

        .figma-auth .form-control {
            min-height: 44px;
            border-color: #dddddd;
            border-radius: 0;
            font-size: 1.05rem;
            letter-spacing: .35em;
            text-align: center;
            font-weight: 700;
        }

        .figma-auth .form-control:focus {
            border-color: #8e8e8e;
            box-shadow: none;
        }

        .figma-auth .auth-btn {
            background: #393939;
            color: #f4f4f4;
            border: 0;
            border-radius: 0;
            min-height: 46px;
            font-weight: 600;
            width: 100%;
        }

        .figma-auth .auth-btn:hover {
            background: #2b2b2b;
            color: #fff;
        }

        .figma-auth .hint-link {
            color: #2f2f2f;
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        @media (max-width: 992px) {
            .figma-auth .auth-visual {
                min-height: 220px;
            }
        }
    </style>
</head>
<body>
<main class="figma-auth">
    <th:block th:replace="~{fragments/figma-shell :: topNav('home', '#')}"></th:block>

    <section class="auth-wrap">
        <div class="container">
            <div class="row g-0 auth-box">
                <div class="col-lg-6 d-none d-lg-block">
                    <div class="auth-visual">
                        <div>
                            <h2>Verify Reset Code</h2>
                            <p>Enter the 6-digit code sent to your email to continue password reset.</p>
                        </div>
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="auth-form">
                        <h1 class="auth-title">Code Verification</h1>
                        <p class="auth-subtitle">
                            Code sent to <strong th:text="${email}">you@example.com</strong>.
                        </p>

                        <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>
                        <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>

                        <form th:action="@{/forgot-password/verify}" method="post" class="mb-3">
                            <div class="mb-3">
                                <label for="code" class="form-label">Verification Code</label>
                                <input id="code" name="code" type="text" class="form-control"
                                       minlength="6" maxlength="6" pattern="[0-9]{6}"
                                       placeholder="000000" autocomplete="one-time-code" inputmode="numeric" required />
                            </div>

                            <button type="submit" class="btn auth-btn">Verify code</button>
                        </form>

                        <form th:action="@{/forgot-password/resend}" method="post" class="mb-2">
                            <button type="submit" class="btn btn-link p-0 hint-link">Resend code</button>
                        </form>

                        <p class="small mb-0">
                            Wrong email?
                            <a class="hint-link" th:href="@{/forgot-password}">Use a different email</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
<th:block th:replace="~{footer :: scripts}"></th:block>
</body>
</html>
