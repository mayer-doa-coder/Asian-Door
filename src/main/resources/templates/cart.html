<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{header :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/figma-shared.css}"/>
    <title>Asian Wooden Decor | Cart</title>

    <style>
        .figma-flow {
            background: #f6f6f6;
            color: #2f2f2f;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .figma-flow .cart-wrap {
            padding-top: 2rem;
            padding-bottom: 2.5rem;
        }

        .figma-flow .cart-panel {
            background: #fff;
            border: 1px solid #e9e9e9;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .04);
        }

        .figma-flow .cart-main,
        .figma-flow .cart-summary {
            padding: 1.6rem;
        }

        .figma-flow .cart-main {
            border-right: 1px solid #ededed;
        }

        .figma-flow .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: .75rem;
            margin-bottom: 1.15rem;
        }

        .figma-flow .title-row h1 {
            font-size: 2.1rem;
            font-weight: 800;
            margin: 0;
        }

        .figma-flow .title-row small {
            color: #7a7a7a;
            font-weight: 600;
        }

        .figma-flow .cart-table {
            margin-bottom: 0;
        }

        .figma-flow .cart-table thead {
            display: none;
        }

        .figma-flow .cart-table td {
            border-top: 0;
            border-bottom: 1px solid #ededed;
            vertical-align: middle;
            padding: 1rem .35rem;
        }

        .figma-flow .cart-table tr:last-child td {
            border-bottom: 0;
        }

        .figma-flow .cart-product {
            display: flex;
            align-items: center;
            gap: .85rem;
            min-width: 255px;
        }

        .figma-flow .cart-product img {
            width: 64px;
            height: 64px;
            object-fit: cover;
            border-radius: .35rem;
            background: #ececec;
        }

        .figma-flow .cart-product-name {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.3;
            color: #2f2f2f;
        }

        .figma-flow .cart-meta {
            margin: .12rem 0 0;
            color: #7b7b7b;
            font-size: .82rem;
        }

        .figma-flow .cart-price {
            font-size: 1rem;
            font-weight: 700;
            color: #262626;
            white-space: nowrap;
        }

        .figma-flow .cart-qty-pill {
            min-width: 3.4rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #d8d8d8;
            background: #fafafa;
            padding: .2rem .55rem;
            font-weight: 700;
            font-size: .86rem;
            color: #2f2f2f;
        }

        .figma-flow .remove-btn {
            border: 0;
            background: transparent;
            color: #9b9b9b;
            font-size: 1rem;
            padding: .1rem;
        }

        .figma-flow .remove-btn:hover {
            color: #393939;
        }

        .figma-flow .back-shop {
            margin-top: 1.1rem;
            display: inline-flex;
            align-items: center;
            gap: .45rem;
            color: #525252;
            font-weight: 600;
            font-size: .92rem;
            text-decoration: none;
        }

        .figma-flow .back-shop:hover {
            color: #171717;
        }

        .figma-flow .summary-title {
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 1.15rem;
        }

        .figma-flow .summary-section {
            border-top: 1px solid #ececec;
            padding-top: .8rem;
            margin-top: .8rem;
        }

        .figma-flow .sum-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: .6rem;
            color: #575757;
            font-weight: 600;
        }

        .figma-flow .payment-option {
            border: 1px solid #dedede;
            background: #fafafa;
            border-radius: .45rem;
            padding: .45rem .6rem;
            margin-bottom: .5rem;
            display: flex;
            align-items: center;
            gap: .55rem;
            font-size: .92rem;
            color: #303030;
        }

        .figma-flow .total-row {
            border-top: 1px solid #ececec;
            padding-top: .85rem;
            margin-top: .9rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 800;
            color: #242424;
            font-size: 1.18rem;
        }

        .figma-flow .checkout-btn {
            margin-top: 1rem;
            width: 100%;
            min-height: 44px;
            border: 0;
            border-radius: .2rem;
            background: #111;
            color: #fff;
            font-weight: 700;
            font-size: .95rem;
        }

        .figma-flow .checkout-btn:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .figma-flow .cart-empty {
            border: 1px dashed #cfcfcf;
            border-radius: .7rem;
            text-align: center;
            padding: 1.5rem;
            background: #fff;
            margin-top: 1rem;
        }

        @media (max-width: 991px) {
            .figma-flow .cart-main {
                border-right: 0;
                border-bottom: 1px solid #ededed;
            }

            .figma-flow .title-row h1 {
                font-size: 1.85rem;
            }
        }
    </style>
</head>
<body>
<main class="figma-flow" data-cart-page="true">
    <th:block th:replace="~{fragments/figma-shell :: topNav('shop', '#cart-footer')}"></th:block>

    <section class="container cart-wrap">
        <div id="cartAlertHost" class="mb-3"></div>

        <div class="cart-panel">
            <div class="row g-0 align-items-start">
                <section class="col-lg-8 cart-main">
                    <div class="title-row">
                        <h1>Shopping Cart</h1>
                        <small><span id="cartSummaryItems">0</span> items</small>
                    </div>

                    <div class="table-responsive">
                        <table class="table align-middle cart-table" id="cartTable">
                            <thead>
                            <tr>
                                <th>Product Name</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Total</th>
                                <th>Remove</th>
                            </tr>
                            </thead>
                            <tbody id="cartTableBody">
                            <tr>
                                <td colspan="5" class="text-center text-muted py-4">Loading cart...</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <a class="back-shop" th:href="@{/products}">
                        <i class="bi bi-arrow-left"></i>Back to shop
                    </a>

                    <div id="cartEmptyState" class="cart-empty d-none">
                        <i class="bi bi-cart-x fs-2 text-muted"></i>
                        <h5 class="mt-2 mb-1">Your cart is empty</h5>
                        <p class="text-muted mb-0">Add products to continue to checkout.</p>
                    </div>
                </section>

                <aside class="col-lg-4 cart-summary">
                    <h2 class="summary-title">Summary</h2>

                    <div class="summary-section">
                        <div class="sum-row">
                            <span>Items</span>
                            <span id="summaryCountLabel">0</span>
                        </div>
                        <div class="sum-row mb-0">
                            <span>Subtotal</span>
                            <span id="cartSummaryTotal">Tk 0.00</span>
                        </div>
                    </div>

                    <div class="summary-section">
                        <div class="sum-row mb-2">
                            <span>Payment</span>
                        </div>
                        <label class="payment-option">
                            <input type="radio" name="cartPaymentMethod" value="BKASH">
                            <span>Bkash</span>
                        </label>
                        <label class="payment-option mb-0">
                            <input type="radio" name="cartPaymentMethod" value="CASH_ON_DELIVERY" checked>
                            <span>Cash on Delivery</span>
                        </label>
                    </div>

                    <div class="total-row">
                        <span>Total</span>
                        <span id="summaryTotalLabel">Tk 0.00</span>
                    </div>

                    <button id="checkoutBtn" class="checkout-btn" disabled>
                        CHECKOUT
                    </button>
                </div>
                </aside>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/figma-shell :: darkFooter('cart-footer')}"></footer>
</main>

<th:block th:replace="~{footer :: scripts}"></th:block>
</body>
</html>
