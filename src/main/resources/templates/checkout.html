<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::style}, ~{::main})}">
<head>
    <title>Checkout - Asian Door</title>
    <style>
        .checkout-hero {
            background: linear-gradient(125deg, #0f172a 0%, #1e293b 55%, #334155 100%);
            padding: 2.4rem 0;
            color: #fff;
        }

        .checkout-hero .eyebrow {
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            color: #fbbf24;
        }

        .checkout-list .list-group-item {
            border-left: 0;
            border-right: 0;
            padding-top: 0.95rem;
            padding-bottom: 0.95rem;
        }

        .checkout-item-title {
            font-weight: 700;
            color: #111827;
        }

        .checkout-item-meta {
            font-size: 0.8rem;
            color: #6b7280;
        }

        .checkout-total {
            font-size: 2rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.4px;
        }

        .confirm-btn {
            border: 0;
            border-radius: 0.65rem;
            padding: 0.75rem 1rem;
            background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
            color: #fff;
            font-weight: 700;
            width: 100%;
        }

        .confirm-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .checkout-empty {
            border: 1px dashed #cbd5e1;
            border-radius: 0.8rem;
            background: #fff;
            padding: 1.5rem;
            text-align: center;
        }
    </style>
</head>
<body>
<main data-checkout-page="true">
    <header class="checkout-hero">
        <div class="container">
            <p class="eyebrow mb-2"><i class="bi bi-receipt me-1"></i>Checkout</p>
            <h1 class="h2 fw-bold mb-1">Order Summary</h1>
            <p class="mb-0 text-white-50">Review all items and confirm your order.</p>
        </div>
    </header>

    <div class="container py-4 py-lg-5">
        <div id="checkoutAlertHost" class="mb-3"></div>

        <div class="row g-4 align-items-start">
            <section class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-dark text-white fw-semibold">
                        <i class="bi bi-bag me-1"></i> Items in Your Order
                    </div>
                    <div class="list-group list-group-flush checkout-list" id="checkoutItemsList">
                        <div class="list-group-item text-muted text-center py-4">Loading order summary...</div>
                    </div>
                </div>

                <div id="checkoutEmptyState" class="checkout-empty mt-3 d-none">
                    <i class="bi bi-cart-x fs-3 text-muted"></i>
                    <h5 class="mt-2 mb-1">No items available for checkout</h5>
                    <p class="text-muted mb-3">Add products to cart first.</p>
                    <a th:href="@{/cart/view}" class="btn btn-dark btn-sm">
                        <i class="bi bi-cart3 me-1"></i>Back to Cart
                    </a>
                </div>
            </section>

            <aside class="col-lg-4">
                <div class="card border-0 shadow-sm sticky-top" style="top: 88px;">
                    <div class="card-body">
                        <p class="text-uppercase small fw-bold text-muted mb-2" style="letter-spacing: 1px;">Total Price</p>
                        <p class="checkout-total mb-1" id="checkoutTotalPrice">PHP 0.00</p>
                        <p class="small text-muted mb-3">Items: <span id="checkoutItemCount">0</span></p>

                        <button id="confirmOrderBtn" class="confirm-btn" disabled>
                            <i class="bi bi-check2-circle me-1"></i>Confirm Order
                        </button>

                        <a th:href="@{/cart/view}" class="btn btn-outline-dark w-100 mt-2">
                            <i class="bi bi-arrow-left me-1"></i>Return to Cart
                        </a>
                    </div>
                </div>
            </aside>
        </div>
    </div>
</main>
</body>
</html>
