spring.application.name=asiandoor

# ─── PostgreSQL DataSource ───────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
# NOTE: dialect is auto-detected; no need to set it explicitly
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.open-in-view=false

# ─── Server ──────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8081}

# ─── Session ─────────────────────────────────────────────────────────────────
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=strict
server.servlet.session.tracking-modes=cookie

# ─── File Uploads ───────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.products-dir=${UPLOAD_PRODUCTS_DIR:uploads/products}

# ─── Default Admin Seeder Account ──────────────────────────────────────────
app.admin.name=${APP_ADMIN_NAME:Asian Door Admin}
app.admin.email=${APP_ADMIN_EMAIL:admin@asiandoor.com}
app.admin.password=${APP_ADMIN_PASSWORD:change_this_admin_password}

# ─── Signup Verification (Email OTP) ───────────────────────────────────────
app.verification.code-expiry-minutes=${APP_VERIFICATION_CODE_EXPIRY_MINUTES:10}
app.password-reset.code-expiry-minutes=${APP_PASSWORD_RESET_CODE_EXPIRY_MINUTES:10}

# ─── Mail Configuration ─────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:asianwoodendecor@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from-email=${APP_MAIL_FROM_EMAIL:asianwoodendecor@gmail.com}
app.mail.from-name=${APP_MAIL_FROM_NAME:Asian Wooden Decor Support}

