<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::style}, ~{::main})}">
<head>
    <title>My Orders - Asian Door</title>
    <style>
        .orders-hero {
            background: linear-gradient(130deg, #111827 0%, #1f2937 55%, #374151 100%);
            color: #fff;
            padding: 2.4rem 0;
        }

        .orders-hero .eyebrow {
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            color: #fbbf24;
        }

        .orders-table thead th {
            font-size: 0.74rem;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            background: #0f172a;
            color: #fff;
            border-bottom: 0;
        }

        .status-pill {
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            padding: 0.28em 0.72em;
            display: inline-block;
        }

        .status-pending { background: #fff7ed; color: #c2410c; }
        .status-processing { background: #eff6ff; color: #1d4ed8; }
        .status-shipped { background: #ecfeff; color: #0f766e; }
        .status-delivered { background: #ecfdf5; color: #15803d; }
    </style>
</head>
<body>
<main>
    <header class="orders-hero">
        <div class="container">
            <p class="eyebrow mb-2"><i class="bi bi-clock-history me-1"></i>Order Tracking</p>
            <h1 class="h2 fw-bold mb-1">Order History</h1>
            <p class="mb-0 text-white-50">Track all your door purchases and delivery progress.</p>
        </div>
    </header>

    <div class="container py-4 py-lg-5">
        <div class="alert alert-success d-flex align-items-center gap-2" role="alert"
             th:if="${placedOrderId != null}">
            <i class="bi bi-check-circle-fill"></i>
            <span>Order <strong th:text="${'#' + placedOrderId}">#0</strong> has been placed successfully.</span>
        </div>

        <div class="card border-0 shadow-sm" th:if="${orders != null and !#lists.isEmpty(orders)}">
            <div class="table-responsive">
                <table class="table align-middle mb-0 orders-table">
                    <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Date</th>
                        <th>Total</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="order : ${orders}">
                        <td class="fw-semibold" th:text="${'#' + order.id}">#0</td>
                        <td>
                            <span th:text="${#temporals.format(order.orderDate, 'dd MMM yyyy')}">01 Jan 2026</span>
                            <div class="small text-muted" th:text="${#temporals.format(order.orderDate, 'hh:mm a')}">10:00 AM</div>
                        </td>
                        <td class="fw-bold text-danger"
                            th:text="${'PHP ' + #numbers.formatDecimal(order.totalPrice, 1, 'COMMA', 2, 'POINT')}">PHP 0.00</td>
                        <td>
                            <span class="status-pill"
                                  th:classappend="${' status-' + #strings.toLowerCase(order.status)}"
                                  th:text="${order.status}">PENDING</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card border-0 shadow-sm" th:if="${orders == null or #lists.isEmpty(orders)}">
            <div class="card-body text-center py-5">
                <i class="bi bi-inbox fs-2 text-muted"></i>
                <h5 class="mt-3 mb-1">No orders yet</h5>
                <p class="text-muted mb-3">Your placed orders will appear here.</p>
                <a th:href="@{/products}" class="btn btn-dark btn-sm">
                    <i class="bi bi-grid me-1"></i>Shop Products
                </a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
