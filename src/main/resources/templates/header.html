<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

    <!--
     | th:fragment="head"
     | Common <head> content injected into every page via layout.html.
     | Includes charset, viewport, Bootstrap CSS, Bootstrap Icons, and site CSS.
     +-->
    <th:block th:fragment="head">
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
              crossorigin="anonymous"/>
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
        <link rel="stylesheet" th:href="@{/css/style.css}"/>
    </th:block>

</head>
<body>

    <!--
     | th:fragment="header"
     | Site-wide sticky navigation bar.
     +-->
    <nav th:fragment="header"
         class="navbar navbar-expand-lg navbar-dark sticky-top navbar-glass" id="siteNav">
        <div class="container">

            <!-- Brand -->
            <a class="navbar-brand fw-bold d-flex align-items-center" th:href="@{/}">
                <img th:src="@{/images/logo.png}" alt="A" class="navbar-brand-logo" />
                <span>sian Door</span>
            </a>

            <!-- Mobile toggler -->
            <button class="navbar-toggler border-0" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navbarMain"
                    aria-controls="navbarMain" aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMain">

                <!-- Left nav: Home | Products | Cart -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}" data-nav-path="/">
                            <i class="bi bi-house-door me-1"></i>Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/products}" data-nav-path="/products">
                            <i class="bi bi-grid me-1"></i>Products
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link position-relative" th:href="@{/cart}" data-nav-path="/cart">
                            <i class="bi bi-cart3 me-1"></i>Cart
                            <span class="position-absolute top-0 start-100 translate-middle
                                         badge rounded-pill bg-danger nav-cart-badge">0</span>
                        </a>
                    </li>

                </ul>

                <!-- Search bar -->
                <form class="d-flex me-3 my-2 my-lg-0" th:action="@{/products}" method="get">
                    <div class="input-group input-group-sm">
                        <input class="form-control nav-search-input" type="search" name="search"
                               placeholder="Search doors…" aria-label="Search"/>
                        <button class="btn btn-outline-light" type="submit">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </form>

                <!-- Right nav: Login | Admin -->
                <ul class="navbar-nav mb-2 mb-lg-0 align-items-lg-center gap-1">

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/login}" data-nav-path="/login">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Login
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="btn btn-sm btn-outline-danger nav-admin-btn"
                           th:href="@{/admin}">
                            <i class="bi bi-shield-lock me-1"></i>Admin
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

</body>
</html>
