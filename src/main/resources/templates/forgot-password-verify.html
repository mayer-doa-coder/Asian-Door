<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{header :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/figma-shared.css}"/>
    <title>Asian Wooden Decor | Verify Reset Code</title>

    <style th:inline="css">
        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        .figma-auth {
            width: 100%;
            height: 100vh;
            display: flex;
            color: #2f2f2f;
            background: #f5f3ef;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .figma-auth a { text-decoration: none; }

        .figma-auth .auth-left,
        .figma-auth .auth-right {
            width: 50%;
            height: 100%;
        }

        .figma-auth .auth-left {
            position: relative;
            overflow: hidden;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .figma-auth .auth-left::before {
            content: "";
            position: absolute;
            inset: -18px;
            background: url([[@{/images/login-signup/grunge-wood-texture-background_1048-7944.avif}]]) center/cover no-repeat;
            filter: blur(3px);
            transform: scale(1.05);
        }

        .figma-auth .auth-left::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(140deg, rgba(26, 16, 10, .68), rgba(43, 27, 17, .45));
        }

        .figma-auth .left-content {
            position: relative;
            z-index: 2;
            padding: 2rem 2.4rem;
            max-width: 86%;
        }

        .figma-auth .brand-stack {
            display: inline-flex;
            align-items: center;
            gap: .85rem;
            margin-bottom: 1.25rem;
        }

        .figma-auth .brand-stack img {
            width: 42px;
            height: 42px;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        .figma-auth .brand-stack h1 {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: .02em;
            text-transform: uppercase;
        }

        .figma-auth .left-heading {
            margin: 0 0 .75rem;
            font-size: clamp(1.8rem, 3vw, 2.35rem);
            line-height: 1.18;
            font-weight: 700;
        }

        .figma-auth .left-copy {
            margin: 0 0 1.1rem;
            color: rgba(255, 255, 255, .9);
            line-height: 1.45;
            max-width: 46ch;
        }

        .figma-auth .typewriter-line {
            font-size: 1.04rem;
            font-weight: 600;
            color: #f4e1c7;
            min-height: 1.6rem;
        }

        .figma-auth .typewriter-text {
            border-right: 2px solid rgba(244, 225, 199, .95);
            padding-right: .28rem;
            animation: caretBlink .9s step-end infinite;
        }

        .figma-auth .auth-right {
            background: #f9f8f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.2rem;
        }

        .figma-auth .auth-form {
            width: min(100%, 470px);
            background: #fff;
            border: 1px solid #e7e4dc;
            box-shadow: 0 14px 30px rgba(0, 0, 0, .08);
            border-radius: .5rem;
            padding: 1.2rem 1.25rem;
        }

        .figma-auth .auth-title {
            font-size: 1.65rem;
            font-weight: 700;
            color: #2b2b2b;
            margin-bottom: .2rem;
        }

        .figma-auth .auth-subtitle {
            color: #7e7b76;
            margin-bottom: .8rem;
            font-size: .9rem;
        }

        .figma-auth .form-label {
            font-size: .74rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: #666;
            margin-bottom: .3rem;
        }

        .figma-auth .form-control {
            min-height: 40px;
            border-color: #ddd8ce;
            border-radius: 0;
            font-size: 1.05rem;
            letter-spacing: .35em;
            text-align: center;
            font-weight: 700;
        }

        .figma-auth .form-control:focus {
            border-color: #8f7a63;
            box-shadow: none;
        }

        .figma-auth .auth-btn {
            background: #4a3728;
            color: #f5efe6;
            border: 0;
            border-radius: 0;
            min-height: 42px;
            font-weight: 600;
            width: 100%;
        }

        .figma-auth .auth-btn:hover {
            background: #3f2f22;
            color: #fff;
        }

        .figma-auth .hint-link {
            color: #4a3728;
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .figma-auth .alert {
            margin-bottom: .7rem;
        }

        @keyframes caretBlink {
            0%,
            100% { border-color: rgba(244, 225, 199, .95); }
            50% { border-color: transparent; }
        }

        @media (max-width: 992px) {
            .figma-auth .auth-left {
                display: none;
            }

            .figma-auth .auth-right {
                width: 100%;
                padding: .75rem;
            }

            .figma-auth .auth-form {
                width: min(100%, 560px);
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
<main class="figma-auth">
    <section class="auth-left">
        <div class="left-content">
            <div class="brand-stack">
                <img th:src="@{/images/logo.png}" alt="Asian Wooden Decor logo" />
                <h1>Asian Wooden Decor</h1>
            </div>
            <h2 class="left-heading">Confirm Your Code To Securely Continue</h2>
            <p class="left-copy">Enter the verification code sent to your email and move to your password reset step safely.</p>
            <p class="typewriter-line">
                Verifying <span id="forgotVerifyTypewriter" class="typewriter-text"></span>
            </p>
        </div>
    </section>

    <section class="auth-right">
        <div class="auth-form">
            <h2 class="auth-title">Code Verification</h2>
            <p class="auth-subtitle">
                Code sent to <strong th:text="${email}">you@example.com</strong>.
            </p>

            <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>

            <form th:action="@{/forgot-password/verify}" method="post" class="mb-3">
                <div class="mb-2">
                    <label for="code" class="form-label">Verification Code</label>
                    <input id="code" name="code" type="text" class="form-control"
                           minlength="6" maxlength="6" pattern="[0-9]{6}"
                           placeholder="Enter your verification code" autocomplete="one-time-code" inputmode="numeric" required />
                </div>

                <button type="submit" class="btn auth-btn">Verify code</button>
            </form>

            <form th:action="@{/forgot-password/resend}" method="post" class="mb-2">
                <button type="submit" class="btn btn-link p-0 hint-link">Resend code</button>
            </form>

            <p class="small mb-0">
                Wrong email?
                <a class="hint-link" th:href="@{/forgot-password}">Use a different email</a>
            </p>
        </div>
    </section>
</main>
<th:block th:replace="~{footer :: scripts}"></th:block>
<script>
    (function runTypewriter() {
        var target = document.getElementById('forgotVerifyTypewriter');
        if (!target) {
            return;
        }

        var words = ['Your Identity', 'Your Security', 'Your Request', 'Your Recovery'];
        var wordIndex = 0;
        var charIndex = 0;
        var deleting = false;

        function tick() {
            var currentWord = words[wordIndex];
            if (!deleting) {
                charIndex++;
                target.textContent = currentWord.slice(0, charIndex);
                if (charIndex === currentWord.length) {
                    deleting = true;
                    setTimeout(tick, 1200);
                    return;
                }
            } else {
                charIndex--;
                target.textContent = currentWord.slice(0, charIndex);
                if (charIndex === 0) {
                    deleting = false;
                    wordIndex = (wordIndex + 1) % words.length;
                }
            }

            setTimeout(tick, deleting ? 45 : 85);
        }

        tick();
    })();
</script>
</body>
</html>
