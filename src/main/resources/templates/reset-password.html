<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{header :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/figma-shared.css}"/>
    <title>Asian Door | Set New Password</title>

    <style>
        .figma-auth {
            background: #f6f6f6;
            color: #2f2f2f;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .figma-auth a { text-decoration: none; }

        .figma-auth .auth-wrap {
            padding: 1.2rem 0 3rem;
        }

        .figma-auth .auth-box {
            background: #fff;
            border: 1px solid #ececec;
            box-shadow: 0 16px 40px rgba(0, 0, 0, .06);
        }

        .figma-auth .auth-visual {
            background: linear-gradient(rgba(0,0,0,.28), rgba(0,0,0,.28)),
                        url([[@{/images/products/door10.png}]]) center/cover no-repeat;
            min-height: 520px;
            display: flex;
            align-items: end;
            color: #fff;
            padding: 2rem;
        }

        .figma-auth .auth-visual h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: .55rem;
        }

        .figma-auth .auth-visual p {
            margin: 0;
            color: rgba(255,255,255,.85);
            line-height: 1.45;
        }

        .figma-auth .auth-form {
            padding: 2rem;
        }

        .figma-auth .auth-title {
            font-size: 1.9rem;
            font-weight: 700;
            color: #2b2b2b;
            margin-bottom: .3rem;
        }

        .figma-auth .auth-subtitle {
            color: #8d8d8d;
            margin-bottom: 1.1rem;
            font-size: .94rem;
        }

        .figma-auth .form-label {
            font-size: .8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: #666;
        }

        .figma-auth .input-group-text,
        .figma-auth .form-control,
        .figma-auth .btn-outline-secondary {
            border-radius: 0;
        }

        .figma-auth .form-control {
            min-height: 44px;
            border-color: #dddddd;
        }

        .figma-auth .form-control:focus {
            border-color: #8e8e8e;
            box-shadow: none;
        }

        .figma-auth .auth-btn {
            background: #393939;
            color: #f4f4f4;
            border: 0;
            border-radius: 0;
            min-height: 46px;
            font-weight: 600;
            width: 100%;
        }

        .figma-auth .auth-btn:hover {
            background: #2b2b2b;
            color: #fff;
        }

        .figma-auth .hint-link {
            color: #2f2f2f;
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        @media (max-width: 992px) {
            .figma-auth .auth-visual {
                min-height: 220px;
            }
        }
    </style>
</head>
<body>
<main class="figma-auth">
    <th:block th:replace="~{fragments/figma-shell :: topNav('home', '#')}"></th:block>

    <section class="auth-wrap">
        <div class="container">
            <div class="row g-0 auth-box">
                <div class="col-lg-6 d-none d-lg-block">
                    <div class="auth-visual">
                        <div>
                            <h2>Create New Password</h2>
                            <p>Set a new password for your account and continue securely.</p>
                        </div>
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="auth-form">
                        <h1 class="auth-title">Set New Password</h1>
                        <p class="auth-subtitle">For <strong th:text="${email}">you@example.com</strong>.</p>

                        <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>

                        <form th:action="@{/reset-password}" method="post">
                            <div class="mb-3">
                                <label for="password" class="form-label">New Password</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" id="password" name="password" class="form-control"
                                           placeholder="Minimum 8 characters" minlength="8" autocomplete="new-password" required />
                                    <button class="btn btn-outline-secondary" type="button"
                                            onclick="togglePwd('password', this)" aria-label="Toggle password visibility">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Confirm Password</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                                           placeholder="Repeat new password" minlength="8" autocomplete="new-password" required />
                                    <button class="btn btn-outline-secondary" type="button"
                                            onclick="togglePwd('confirmPassword', this)" aria-label="Toggle confirm password visibility">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn auth-btn">Reset password</button>
                        </form>

                        <p class="small mt-3 mb-0">
                            Return to
                            <a class="hint-link" th:href="@{/login}">Login</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
<th:block th:replace="~{footer :: scripts}"></th:block>
<script>
    function togglePwd(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    }
</script>
</body>
</html>
