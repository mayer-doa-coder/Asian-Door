<!DOCTYPE html>
<!--
  admin/products.html — Admin product management list.
  Requires ROLE_SELLER (enforced by SecurityConfig).
-->
<html th:replace="~{layout :: layout(~{::title}, ~{}, ~{::main})}">
<head>
    <title>Manage Products - Admin | Asian Door</title>
</head>
<body>
<main class="container py-4">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item">
                <a th:href="@{/}" class="text-decoration-none text-secondary">Home</a>
            </li>
            <li class="breadcrumb-item active fw-semibold">Admin — Products</li>
        </ol>
    </nav>

    <!-- Header row -->
    <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
        <h4 class="mb-0 section-title" style="border: none; padding: 0;">
            <i class="bi bi-shield-lock me-2 text-danger"></i>Product Management
        </h4>
        <a th:href="@{/admin/products/new}" class="btn btn-dark btn-sm">
            <i class="bi bi-plus-lg me-1"></i>Add New Product
        </a>
    </div>

    <!-- Flash success message -->
    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show py-2 small" role="alert">
        <i class="bi bi-check-circle me-1"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Product table -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="ps-3" style="width:50px;">#</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Material</th>
                            <th class="text-end">Price (₱)</th>
                            <th class="text-center">Stock</th>
                            <th class="text-center" style="width:160px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Populated rows -->
                        <tr th:each="product : ${products}">
                            <td class="ps-3 text-muted small" th:text="${product.id}">1</td>
                            <td>
                                <a th:href="@{/products/{id}(id=${product.id})}"
                                   class="fw-semibold text-dark text-decoration-none"
                                   th:text="${product.name}"
                                   target="_blank">Product Name</a>
                            </td>
                            <td>
                                <span th:if="${product.category != null}"
                                      th:text="${#strings.capitalize(product.category)}"
                                      th:classappend="${'category-badge-' + product.category}"
                                      class="category-badge"></span>
                            </td>
                            <td class="text-muted small"
                                th:text="${product.material != null} ? ${product.material} : '—'">—</td>
                            <td class="text-end fw-semibold"
                                th:text="${product.price != null}
                                    ? ${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}
                                    : '0.00'">0.00</td>
                            <td class="text-center">
                                <span th:text="${product.stock}" class="small fw-semibold"
                                      th:classappend="${product.stock == 0}  ? 'text-danger'
                                                    : (${product.stock <= 5} ? 'text-warning'
                                                    : 'text-success')">0</span>
                            </td>
                            <td class="text-center">
                                <div class="d-flex gap-1 justify-content-center">
                                    <!-- Edit -->
                                    <a th:href="@{/admin/products/{id}/edit(id=${product.id})}"
                                       class="btn btn-outline-secondary btn-sm"
                                       title="Edit">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    <!-- Delete -->
                                    <form th:action="@{/admin/products/{id}/delete(id=${product.id})}"
                                          method="post"
                                          onsubmit="return confirm('Delete \'' + this.dataset.name + '\'? This cannot be undone.');"
                                          th:data-name="${product.name}">
                                        <button type="submit" class="btn btn-outline-danger btn-sm" title="Delete">
                                            <i class="bi bi-trash3"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>

                        <!-- Empty state row -->
                        <tr th:if="${products == null or #lists.isEmpty(products)}">
                            <td colspan="7" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox display-6 d-block mb-2"></i>
                                No products found.
                                <a th:href="@{/admin/products/new}" class="d-block mt-1 small">Add your first product →</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- Table footer: product count -->
        <div class="card-footer bg-transparent text-muted small py-2 px-3"
             th:if="${products != null and !#lists.isEmpty(products)}">
            <span th:text="${#lists.size(products)}">0</span> product(s) total
        </div>
    </div>

</main>
</body>
</html>
