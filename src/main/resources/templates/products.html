<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{header :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/figma-shared.css}"/>
    <title>Asian Door | Products</title>

    <style th:inline="css">
        .figma-products {
            background: #f6f6f6;
            color: #2f2f2f;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .figma-products a {
            text-decoration: none;
        }


        .figma-products .results-row {
            margin-top: 1.2rem;
            margin-bottom: 1.4rem;
            color: #7e7e7e;
            font-size: .92rem;
        }

        .figma-products .sort-wrap {
            display: flex;
            align-items: center;
            justify-content: end;
            gap: .55rem;
        }

        .figma-products .sort-wrap select {
            border: 1px solid #d3d3d3;
            background: #fff;
            color: #7e7e7e;
            font-size: .92rem;
            padding: .35rem .55rem;
            min-width: 170px;
        }

        .figma-products .product-grid-wrap {
            padding-bottom: 2.8rem;
        }

        .figma-products .product-card {
            color: #2d2d2d;
            text-align: center;
            display: block;
        }

        .figma-products .product-card .img-wrap {
            background: #dedede;
            width: 100%;
            aspect-ratio: 3 / 4;
            overflow: hidden;
        }

        .figma-products .product-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .25s ease;
            display: block;
        }

        .figma-products .product-card:hover img {
            transform: scale(1.04);
        }

        .figma-products .product-card h6 {
            margin-top: .75rem;
            margin-bottom: .45rem;
            font-size: 1rem;
            font-weight: 700;
            color: #2c2c2c;
        }

        .figma-products .stars {
            color: #a7a7a7;
            letter-spacing: .08em;
            margin-bottom: .4rem;
            font-size: .85rem;
        }

        .figma-products .product-price {
            color: #6b6b6b;
            font-size: .94rem;
            margin: 0;
        }

        .figma-products .filters {
            padding-left: .5rem;
        }

        .figma-products .search-box {
            border: 1px solid rgba(0, 0, 0, .2);
            background: #f6f6f6;
            min-height: 50px;
        }

        .figma-products .search-box .form-control {
            border: 0;
            background: transparent;
            font-size: .92rem;
            color: #7e7e7e;
        }

        .figma-products .search-box .form-control:focus {
            box-shadow: none;
        }

        .figma-products .search-box .btn {
            border: 0;
            color: #646464;
        }

        .figma-products .filter-block {
            margin-top: 1.35rem;
        }

        .figma-products .filter-block h5 {
            font-size: 1.25rem;
            margin-bottom: .9rem;
            color: #2d2d2d;
            font-weight: 700;
        }

        .figma-products .filter-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .figma-products .filter-list li {
            margin-bottom: .75rem;
        }

        .figma-products .filter-list a,
        .figma-products .filter-list span {
            color: #7e7e7e;
            font-size: .95rem;
        }

        .figma-products .filter-list a:hover {
            color: #333;
        }

        .figma-products .price-line {
            height: 3px;
            border-radius: 10px;
            background: #3a3a3a;
            position: relative;
            margin: .55rem 0 .85rem;
        }

        .figma-products .price-line::before,
        .figma-products .price-line::after {
            content: "";
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #3f3f3f;
        }

        .figma-products .price-line::before { left: 0; }
        .figma-products .price-line::after { right: 0; }

        .figma-products .price-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: .5rem;
            gap: .7rem;
        }

        .figma-products .price-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: .55rem;
            margin-top: .75rem;
        }

        .figma-products .price-inputs input {
            width: 100%;
            border: 1px solid #cfcfcf;
            background: #fff;
            color: #6b6b6b;
            font-size: .9rem;
            padding: .45rem .55rem;
        }

        .figma-products .price-footer small {
            color: #7e7e7e;
            font-size: .92rem;
        }

        .figma-products .btn-filter {
            background: #393939;
            color: #f4f4f4;
            border: 0;
            border-radius: 0;
            padding: .4rem 1rem;
            font-size: .88rem;
        }

        .figma-products .btn-clear-filters {
            display: inline-block;
            background: transparent;
            border: 1px solid #cfcfcf;
            color: #5f5f5f;
            border-radius: 0;
            padding: .4rem 1rem;
            font-size: .88rem;
        }

        .figma-products .btn-clear-filters:hover {
            color: #2f2f2f;
            border-color: #9d9d9d;
        }

        .figma-products .pagination-wrap {
            margin-top: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #2b2b2b;
        }

        .figma-products .page-list {
            display: flex;
            align-items: center;
            gap: .9rem;
            flex-wrap: wrap;
        }

        .figma-products .page-list a,
        .figma-products .page-list span {
            color: #2c2c2c;
            font-size: .9rem;
            min-width: 20px;
            text-align: center;
        }

        .figma-products .page-list .active {
            font-weight: 700;
        }

        .figma-products .view-all-link {
            color: #7a7a7a;
            font-size: .9rem;
        }

        .figma-products .empty-state {
            border: 1px dashed #c8c8c8;
            background: #fff;
            padding: 2rem 1.2rem;
            text-align: center;
            color: #707070;
        }

        @media (max-width: 992px) {
            .figma-products .nav-links {
                margin-top: .7rem;
                margin-bottom: .7rem;
            }

            .figma-products .filters {
                padding-left: 0;
                margin-top: 1rem;
            }

            .figma-products .results-row {
                gap: .7rem;
            }
        }
    </style>
</head>
<body>
<main class="figma-products">
    <th:block th:replace="~{fragments/figma-shell :: topNav('shop', '#products-footer')}"></th:block>

    <div class="container">
        <div class="row align-items-center results-row">
            <div class="col-lg-8" th:with="showCount=${products != null ? #lists.size(products) : 0}">
                <span th:text="|Showing 1-${showCount} of ${totalProducts != null ? totalProducts : 0} results|"></span>
            </div>
            <div class="col-lg-4 sort-wrap">
                <form th:action="@{/products}" method="get" class="d-flex align-items-center gap-2 ms-lg-auto">
                    <label for="sortView" class="mb-0">Sort by</label>
                    <input type="hidden" name="category" th:value="${category}" />
                    <input type="hidden" name="search" th:value="${search}" />
                    <input type="hidden" name="minPrice" th:value="${minPrice}" />
                    <input type="hidden" name="maxPrice" th:value="${maxPrice}" />
                    <select id="sortView" name="sort" onchange="this.form.submit()">
                        <option value="newest" th:selected="${sort == null or sort == 'newest'}">Newest</option>
                        <option value="oldest" th:selected="${sort == 'oldest'}">Oldest</option>
                        <option value="price_asc" th:selected="${sort == 'price_asc'}">Price: low to high</option>
                        <option value="price_desc" th:selected="${sort == 'price_desc'}">Price: high to low</option>
                        <option value="name_asc" th:selected="${sort == 'name_asc'}">Name: A to Z</option>
                        <option value="name_desc" th:selected="${sort == 'name_desc'}">Name: Z to A</option>
                    </select>
                </form>
            </div>
        </div>
    </div>

    <section class="container product-grid-wrap">
        <div class="row g-4">
            <div class="col-lg-9">
                <div class="row row-cols-1 row-cols-sm-2 row-cols-xl-3 g-4" th:if="${products != null and !#lists.isEmpty(products)}">
                    <div class="col" th:each="product, stat : ${products}">
                        <a class="product-card" th:href="@{/products/{id}(id=${product.id})}">
                            <div class="img-wrap">
                                <img th:if="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl)}"
                                     th:src="@{${product.imageUrl}}"
                                     th:alt="${product.name}"
                                     th:attr="onerror=|this.onerror=null;this.src='@{/images/products-figma/product-1.jpg}'|" />
                                <img th:if="${product.imageUrl == null or #strings.isEmpty(product.imageUrl)}"
                                     th:src="@{'/images/products-figma/product-' + ${((stat.index % 9) + 1)} + '.jpg'}"
                                     th:alt="${product.name}" />
                            </div>
                            <h6 th:text="${product.name}">Modern sofa</h6>
                            <div class="stars" aria-hidden="true">
                                <i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i>
                            </div>
                            <p class="product-price">Tk
                                <span th:text="${product.price != null ? #numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT') : '0.00'}">73.00</span>
                            </p>
                        </a>
                    </div>
                </div>

                <div class="empty-state" th:if="${products == null or #lists.isEmpty(products)}">
                    <p class="mb-2">No products match the current filter.</p>
                    <a th:href="@{/products}" class="view-all-link">View all products</a>
                </div>

                <div class="pagination-wrap" th:if="${totalPages != null and totalPages > 1}">
                    <div class="page-list">
                        <a th:href="@{/products(category=${category}, search=${search}, sort=${sort}, minPrice=${minPrice}, maxPrice=${maxPrice}, page=${currentPage - 1})}"
                           th:if="${currentPage > 0}">
                            <i class="bi bi-chevron-left"></i>
                        </a>

                        <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                            <span class="active" th:if="${i == currentPage}" th:text="${i + 1}">1</span>
                            <a th:if="${i != currentPage}"
                               th:href="@{/products(category=${category}, search=${search}, sort=${sort}, minPrice=${minPrice}, maxPrice=${maxPrice}, page=${i})}"
                               th:text="${i + 1}">1</a>
                        </th:block>

                        <a th:href="@{/products(category=${category}, search=${search}, sort=${sort}, minPrice=${minPrice}, maxPrice=${maxPrice}, page=${currentPage + 1})}"
                           th:if="${currentPage < totalPages - 1}">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </div>
                    <a class="view-all-link" th:href="@{/products}">view all</a>
                </div>
            </div>

            <aside class="col-lg-3 filters">
                <form th:action="@{/products}" method="get" class="search-box input-group">
                    <input type="hidden" name="category" th:value="${category}" />
                    <input type="hidden" name="sort" th:value="${sort}" />
                    <input type="hidden" name="minPrice" th:value="${minPrice}" />
                    <input type="hidden" name="maxPrice" th:value="${maxPrice}" />
                    <input class="form-control" type="search" name="search" placeholder="Search..." th:value="${search}" />
                    <button class="btn" type="submit"><i class="bi bi-search"></i></button>
                </form>

                <div class="filter-block">
                    <h5>Category</h5>
                    <ul class="filter-list">
                        <li>
                            <a th:href="@{/products(search=${search}, sort=${sort}, minPrice=${minPrice}, maxPrice=${maxPrice})}">
                                All ( <span th:text="${totalProducts != null ? totalProducts : 0}">0</span> )
                            </a>
                        </li>
                        <li><a th:href="@{/products(category=wooden,search=${search}, sort=${sort}, minPrice=${minPrice}, maxPrice=${maxPrice})}">Wood (
                            <span th:text="${categoryCounts != null and categoryCounts.containsKey('wooden') ? categoryCounts.get('wooden') : 0}">0</span>)
                        </a></li>
                        <li><a th:href="@{/products(category=steel,search=${search}, sort=${sort}, minPrice=${minPrice}, maxPrice=${maxPrice})}">Steel (
                            <span th:text="${categoryCounts != null and categoryCounts.containsKey('steel') ? categoryCounts.get('steel') : 0}">0</span>)
                        </a></li>
                        <li><a th:href="@{/products(category=glass,search=${search}, sort=${sort}, minPrice=${minPrice}, maxPrice=${maxPrice})}">Glass (
                            <span th:text="${categoryCounts != null and categoryCounts.containsKey('glass') ? categoryCounts.get('glass') : 0}">0</span>)
                        </a></li>
                        <li><a th:href="@{/products(category=security,search=${search}, sort=${sort}, minPrice=${minPrice}, maxPrice=${maxPrice})}">Security (
                            <span th:text="${categoryCounts != null and categoryCounts.containsKey('security') ? categoryCounts.get('security') : 0}">0</span>)
                        </a></li>
                        <li><a th:href="@{/products(category=interior,search=${search}, sort=${sort}, minPrice=${minPrice}, maxPrice=${maxPrice})}">Interior (
                            <span th:text="${categoryCounts != null and categoryCounts.containsKey('interior') ? categoryCounts.get('interior') : 0}">0</span>)
                        </a></li>
                        <li><a th:href="@{/products(category=exterior,search=${search}, sort=${sort}, minPrice=${minPrice}, maxPrice=${maxPrice})}">Exterior (
                            <span th:text="${categoryCounts != null and categoryCounts.containsKey('exterior') ? categoryCounts.get('exterior') : 0}">0</span>)
                        </a></li>
                    </ul>
                </div>

                <div class="filter-block">
                    <h5>Price range</h5>
                    <form th:action="@{/products}" method="get">
                        <input type="hidden" name="category" th:value="${category}" />
                        <input type="hidden" name="search" th:value="${search}" />
                        <input type="hidden" name="sort" th:value="${sort}" />

                        <div class="price-line"></div>
                        <div class="price-inputs">
                            <input id="minPriceInput" type="number" step="500" min="0" name="minPrice" placeholder="Min Tk" th:value="${minPrice}" th:attr="max=${maxPrice}" />
                            <input id="maxPriceInput" type="number" step="500" min="0" name="maxPrice" placeholder="Max Tk" th:value="${maxPrice}" th:attr="min=${minPrice}" />
                        </div>
                        <div class="price-footer">
                            <small>Filter by entered Tk range</small>
                            <button type="submit" class="btn-filter">Filter</button>
                        </div>
                    </form>
                </div>

                <div class="filter-block">
                    <a class="btn-clear-filters" th:href="@{/products}">Clear all filters</a>
                </div>
            </aside>
        </div>
    </section>

    <footer th:replace="~{fragments/figma-shell :: darkFooter('products-footer')}"></footer>
</main>

<th:block th:replace="~{footer :: scripts}"></th:block>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const minInput = document.getElementById('minPriceInput');
        const maxInput = document.getElementById('maxPriceInput');

        if (!minInput || !maxInput || !minInput.form || minInput.form !== maxInput.form) {
            return;
        }

        const form = minInput.form;

        function parseValue(value) {
            if (value === null || value === undefined || value === '') {
                return null;
            }
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : null;
        }

        function updateRangeRules() {
            const minValue = parseValue(minInput.value);
            const maxValue = parseValue(maxInput.value);

            if (minValue !== null) {
                maxInput.min = String(minValue);
            } else {
                maxInput.min = '0';
            }

            if (maxValue !== null) {
                minInput.max = String(maxValue);
            } else {
                minInput.removeAttribute('max');
            }

            if (minValue !== null && maxValue !== null && minValue > maxValue) {
                const message = 'Max price cannot be less than min price.';
                minInput.setCustomValidity(message);
                maxInput.setCustomValidity(message);
            } else {
                minInput.setCustomValidity('');
                maxInput.setCustomValidity('');
            }
        }

        minInput.addEventListener('input', updateRangeRules);
        maxInput.addEventListener('input', updateRangeRules);

        form.addEventListener('submit', function (event) {
            updateRangeRules();
            if (!form.checkValidity()) {
                event.preventDefault();
                form.reportValidity();
            }
        });

        updateRangeRules();
    });
</script>
</body>
</html>
