<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{header :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/figma-shared.css}"/>
    <title>Asian Door | Order History</title>

    <style>
        .figma-flow {
            background: #f6f6f6;
            color: #2f2f2f;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .figma-flow a {
            text-decoration: none !important;
        }

        .figma-flow .orders-shell {
            padding-bottom: 2.6rem;
        }

        .figma-flow .orders-title {
            text-transform: uppercase;
            letter-spacing: .02em;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: .4rem;
        }

        .figma-flow .orders-sub {
            color: #7c7c7c;
            margin-bottom: 1.1rem;
        }

        .figma-flow .orders-card {
            border: 1px solid #e6e6e6;
            border-radius: .95rem;
            background: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,.03);
            overflow: hidden;
        }

        .figma-flow .orders-table thead th {
            border: 0;
            border-bottom: 1px solid #ececec;
            background: #fafafa;
            text-transform: uppercase;
            font-size: .73rem;
            letter-spacing: .05em;
            color: #646464;
            padding-top: .9rem;
            padding-bottom: .9rem;
        }

        .figma-flow .orders-table td {
            vertical-align: middle;
            border-color: #efefef;
            padding-top: .9rem;
            padding-bottom: .9rem;
        }

        .figma-flow .status-pill {
            border-radius: 999px;
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .02em;
            padding: .3em .75em;
            display: inline-block;
        }

        .figma-flow .status-pending { background: #fff7ed; color: #c2410c; }
        .figma-flow .status-processing { background: #eff6ff; color: #1d4ed8; }
        .figma-flow .status-shipped { background: #ecfeff; color: #0f766e; }
        .figma-flow .status-delivered { background: #ecfdf5; color: #15803d; }

        .figma-flow .orders-empty {
            border: 1px dashed #cecece;
            border-radius: .9rem;
            background: #fff;
            text-align: center;
            padding: 1.6rem;
        }

        .figma-flow .quick-actions {
            margin-top: 1rem;
            display: flex;
            gap: .65rem;
            flex-wrap: wrap;
        }

        .figma-flow .quick-actions a {
            border: 1px solid #dadada;
            border-radius: 999px;
            color: #2f2f2f;
            font-size: .85rem;
            text-decoration: none;
            padding: .45rem .95rem;
            font-weight: 600;
            background: #fff;
        }

        .figma-flow .quick-actions a:hover {
            background: #2f2f2f;
            color: #fff;
            border-color: #2f2f2f;
        }
    </style>
</head>
<body>
<main class="figma-flow">
    <th:block th:replace="~{fragments/figma-shell :: topNav('shop', '#orders-footer')}"></th:block>

    <section class="container orders-shell">
        <h1 class="orders-title">Order History</h1>
        <p class="orders-sub">Track all your orders and current delivery status.</p>

        <div class="alert alert-success d-flex align-items-center gap-2" role="alert" th:if="${placedOrderId != null}">
            <i class="bi bi-check-circle-fill"></i>
            <span>Order <strong th:text="${'#' + placedOrderId}">#0</strong> has been placed successfully.</span>
        </div>

        <div class="orders-card" th:if="${orders != null and !#lists.isEmpty(orders)}">
            <div class="table-responsive">
                <table class="table align-middle mb-0 orders-table">
                    <thead>
                    <tr>
                        <th class="ps-3">Order ID</th>
                        <th>Date</th>
                        <th>Total</th>
                        <th class="pe-3">Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="order : ${orders}">
                        <td class="fw-semibold ps-3" th:text="${'#' + order.id}">#0</td>
                        <td>
                            <span th:text="${#temporals.format(order.orderDate, 'dd MMM yyyy')}">01 Jan 2026</span>
                            <div class="small text-muted" th:text="${#temporals.format(order.orderDate, 'hh:mm a')}">10:00 AM</div>
                        </td>
                        <td class="fw-bold" style="color:#2f2f2f;" th:text="${'PHP ' + #numbers.formatDecimal(order.totalPrice, 1, 'COMMA', 2, 'POINT')}">PHP 0.00</td>
                        <td class="pe-3">
                            <span class="status-pill" th:classappend="${' status-' + #strings.toLowerCase(order.status)}" th:text="${order.status}">PENDING</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="orders-empty" th:if="${orders == null or #lists.isEmpty(orders)}">
            <i class="bi bi-inbox fs-2 text-muted"></i>
            <h5 class="mt-2 mb-1">No orders yet</h5>
            <p class="text-muted mb-3">Your placed orders will appear here.</p>
            <a th:href="@{/products}" class="btn btn-dark btn-sm">
                <i class="bi bi-grid me-1"></i>Shop Products
            </a>
        </div>

        <div class="quick-actions" th:if="${orders != null and !#lists.isEmpty(orders)}">
            <a th:href="@{/products}"><i class="bi bi-grid me-1"></i>Continue Shopping</a>
            <a th:href="@{/cart/view}"><i class="bi bi-bag me-1"></i>View Cart</a>
        </div>
    </section>

    <footer th:replace="~{fragments/figma-shell :: darkFooter('orders-footer')}"></footer>
</main>

<th:block th:replace="~{footer :: scripts}"></th:block>
</body>
</html>
