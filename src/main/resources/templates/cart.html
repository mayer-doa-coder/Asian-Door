<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{header :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/figma-shared.css}"/>
    <title>Asian Door | Cart</title>

    <style>
        .figma-flow {
            background: #f6f6f6;
            color: #2f2f2f;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .figma-flow a {
            text-decoration: none !important;
        }

        .figma-flow .cart-title {
            text-transform: uppercase;
            letter-spacing: .02em;
            font-size: 2.1rem;
            font-weight: 800;
            margin-bottom: .85rem;
        }

        .figma-flow .cart-shell {
            padding-bottom: 2.3rem;
        }

        .figma-flow .cart-list-card,
        .figma-flow .summary-card {
            background: #fff;
            border: 1px solid #e6e6e6;
            border-radius: .9rem;
            box-shadow: 0 4px 10px rgba(0,0,0,.03);
        }

        .figma-flow .cart-list-card {
            padding: .5rem .9rem;
        }

        .figma-flow .cart-table thead {
            display: none;
        }

        .figma-flow .cart-table td {
            border-top: 0;
            border-bottom: 1px solid #efefef;
            vertical-align: middle;
            padding: .95rem .45rem;
        }

        .figma-flow .cart-table tr:last-child td {
            border-bottom: 0;
        }

        .figma-flow .cart-product {
            display: flex;
            align-items: center;
            gap: .85rem;
            min-width: 250px;
        }

        .figma-flow .cart-product img {
            width: 72px;
            height: 72px;
            border-radius: .45rem;
            object-fit: cover;
            background: #ececec;
        }

        .figma-flow .cart-product-name {
            margin: 0;
            font-size: 1.03rem;
            font-weight: 700;
            line-height: 1.2;
            color: #2f2f2f;
        }

        .figma-flow .cart-meta {
            margin: .2rem 0 0;
            color: #777;
            font-size: .82rem;
        }

        .figma-flow .cart-price {
            font-size: 1.05rem;
            font-weight: 800;
            color: #222;
        }

        .figma-flow .cart-qty-pill {
            min-width: 4.5rem;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: .32rem .8rem;
            border-radius: 999px;
            background: #f0f0f0;
            color: #2e2e2e;
            font-weight: 700;
        }

        .figma-flow .remove-btn {
            border: 0;
            background: transparent;
            color: #d9534f;
            font-size: 1.02rem;
            padding: .2rem;
        }

        .figma-flow .summary-card {
            padding: 1.2rem;
        }

        .figma-flow .summary-title {
            font-size: 1.55rem;
            font-weight: 700;
            margin-bottom: .7rem;
        }

        .figma-flow .sum-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: .55rem;
            color: #4f4f4f;
        }

        .figma-flow .sum-row strong {
            color: #232323;
        }

        .figma-flow .sum-total {
            border-top: 1px solid #ededed;
            margin-top: .8rem;
            padding-top: .7rem;
            display: flex;
            align-items: end;
            justify-content: space-between;
        }

        .figma-flow .sum-total span {
            font-size: .95rem;
            color: #4f4f4f;
        }

        .figma-flow .sum-total .value {
            font-size: 2rem;
            font-weight: 800;
            color: #1f1f1f;
            line-height: 1;
        }

        .figma-flow .checkout-btn {
            margin-top: .9rem;
            width: 100%;
            border: 0;
            border-radius: 999px;
            min-height: 46px;
            background: #2f2f2f;
            color: #fff;
            font-weight: 700;
        }

        .figma-flow .checkout-btn:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .figma-flow .pay-badges {
            margin-top: .8rem;
            display: flex;
            align-items: center;
            gap: .45rem;
            flex-wrap: wrap;
        }

        .figma-flow .pay-badges img {
            height: 18px;
            width: auto;
            border-radius: .2rem;
            border: 1px solid #efefef;
            background: #fff;
            padding: .05rem .25rem;
        }

        .figma-flow .cart-empty {
            border: 1px dashed #cecece;
            background: #fff;
            text-align: center;
            padding: 1.6rem;
            border-radius: .85rem;
        }

        @media (max-width: 992px) {
            .figma-flow .cart-title { font-size: 1.8rem; }
            .figma-flow .cart-product { min-width: 200px; }
        }
    </style>
</head>
<body>
<main class="figma-flow" data-cart-page="true">
    <th:block th:replace="~{fragments/figma-shell :: topNav('shop', '#cart-footer')}"></th:block>

    <section class="container cart-shell">
        <h1 class="cart-title">Your Cart</h1>

        <div id="cartAlertHost" class="mb-3"></div>

        <div class="row g-3 align-items-start">
            <section class="col-xl-7">
                <div class="cart-list-card">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0 cart-table" id="cartTable">
                            <thead>
                            <tr>
                                <th>Product Name</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Total</th>
                                <th>Remove</th>
                            </tr>
                            </thead>
                            <tbody id="cartTableBody">
                            <tr>
                                <td colspan="5" class="text-center text-muted py-4">Loading cart...</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="cartEmptyState" class="cart-empty mt-3 d-none">
                    <i class="bi bi-cart-x fs-2 text-muted"></i>
                    <h5 class="mt-2 mb-1">Your cart is empty</h5>
                    <p class="text-muted mb-3">Add products to continue to checkout.</p>
                    <a th:href="@{/products}" class="btn btn-dark btn-sm">
                        <i class="bi bi-grid me-1"></i>Browse Products
                    </a>
                </div>
            </section>

            <aside class="col-xl-5">
                <div class="summary-card sticky-top" style="top:88px;">
                    <h2 class="summary-title">Order Summary</h2>

                    <div class="sum-row">
                        <span>Items</span>
                        <strong id="cartSummaryItems">0</strong>
                    </div>
                    <div class="sum-total">
                        <span>Total</span>
                        <p class="value mb-0" id="cartSummaryTotal">Tk 0.00</p>
                    </div>

                    <button id="checkoutBtn" class="checkout-btn" disabled>
                        Go to Checkout <i class="bi bi-arrow-right ms-1"></i>
                    </button>

                    <div class="pay-badges">
                        <img th:src="@{/images/cart-figma/pay-visa.png}" alt="Visa"/>
                        <img th:src="@{/images/cart-figma/pay-mastercard.png}" alt="Mastercard"/>
                        <img th:src="@{/images/cart-figma/pay-paypal.png}" alt="PayPal"/>
                        <img th:src="@{/images/cart-figma/pay-gpay.png}" alt="Google Pay"/>
                    </div>
                </div>
            </aside>
        </div>
    </section>

    <footer th:replace="~{fragments/figma-shell :: darkFooter('cart-footer')}"></footer>
</main>

<th:block th:replace="~{footer :: scripts}"></th:block>
</body>
</html>
