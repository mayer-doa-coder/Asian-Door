<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<th:block th:fragment="adminPage(activeNav, pageTitle, innerContent)">
    <div class="admin-shell">
        <aside class="admin-sidebar">
            <a class="admin-brand" th:href="@{/admin}">Asian Door</a>

            <nav class="sidebar-nav">
                <a th:href="@{/admin}" th:classappend="${activeNav == 'dashboard'} ? 'active' : ''">
                    <i class="bi bi-house"></i><span>Home</span>
                </a>
                <a th:href="@{/admin/products}" th:classappend="${activeNav == 'products'} ? 'active' : ''">
                    <i class="bi bi-box-seam"></i><span>Products</span>
                </a>
                <a th:href="@{/admin/orders}" th:classappend="${activeNav == 'orders'} ? 'active' : ''">
                    <i class="bi bi-receipt"></i><span>Orders</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a th:href="@{/about}"><i class="bi bi-question-circle"></i><span>Help</span></a>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit"><i class="bi bi-box-arrow-right"></i><span>Logout</span></button>
                </form>
            </div>
        </aside>

        <div class="admin-main">
            <header class="admin-topbar">
                <div class="topbar-search">
                    <i class="bi bi-search"></i>
                    <input type="text" placeholder="Search or type a command" aria-label="Search" />
                </div>

                <div class="topbar-actions">
                    <a th:href="@{/admin/products/new}" class="create-btn">
                        <i class="bi bi-plus-lg me-1"></i>Create
                    </a>
                    <a th:href="@{/admin/orders}" class="icon-btn" title="Orders">
                        <i class="bi bi-bell"></i>
                    </a>
                    <a th:href="@{/admin/products}" class="icon-btn" title="Products">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <img class="topbar-avatar" th:src="@{/images/admin-figma/avatar-admin.png}" alt="User avatar" />
                </div>
            </header>

            <section class="admin-content">
                <div class="content-head">
                    <h1 th:text="${pageTitle}">Dashboard</h1>
                </div>
                <th:block th:replace="${innerContent}"></th:block>
            </section>
        </div>
    </div>
</th:block>

</body>
</html>
